<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>גלויה 01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700&family=Rubik:wght@500;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    font-family:'Tel Aviv Brutalist';

  ואז להחליף את 'Rubik' למטה ב-'Tel Aviv Brutalist'

<style>
  :root{
    --paper:#FFFFFF;
    --ink:#000000;
    --postmark:#000000;
    --kraft:#000000;
    --sage:#000000;
    --white:#FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--white);
    font-family:'Rubik', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    min-height:100vh;
  }

  .postcard{
    width:100%;
    max-width:480px;
    background:var(--paper);
    min-height:100vh;
    position:relative;
    box-shadow:0 0 40px rgba(0,0,0,.25);
  }

  /* ---- Photo section ---- */
  .photo-wrap{
    position:relative;
    width:100%;
    aspect-ratio: 4 / 5;
    overflow:hidden;
    background:#cfc6b3;
  }
  .photo-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  /* placeholder look until a real photo is dropped in */
  .photo-wrap.placeholder{
    display:flex;
    align-items:center;
    justify-content:center;
    color:#8a8064;
    font-family:'JetBrains Mono', monospace;
    font-size:.8rem;
    letter-spacing:.05em;
    text-align:center;
    padding:2rem;
    background:
      repeating-linear-gradient(45deg, #d8cfba 0 2px, #cfc6b1 2px 24px);
  }

  /* perforated tear between photo and text, like ripping a postcard in half */
  .tear{
    position:relative;
    height:26px;
    background:var(--paper);
    overflow:hidden;
  }
  .tear::before{
    content:"";
    position:absolute;
    top:-13px; left:0; right:0;
    height:26px;
    background-image: radial-gradient(circle 7px, var(--kraft) 98%, transparent 100%);
    background-position: 0 0;
    background-size: 26px 26px;
    background-repeat: repeat-x;
  }

  /* ---- Postmark stamp, the signature element ---- */
  .postmark{
    position:absolute;
    top:calc(4/5 * 100% - 58px); /* sits straddling the tear line */
    left:24px;
    width:104px;
    height:104px;
    border-radius:50%;
    border:2.5px solid var(--postmark);
    background:var(--white);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transform:rotate(-9deg);
    box-shadow:0 4px 14px rgba(0,0,0,.18);
    z-index:2;
  }
  .postmark::before{
    content:"";
    position:absolute;
    inset:8px;
    border-radius:50%;
    border:1px solid var(--postmark);
  }
  .postmark .num{
    font-family:'Rubik', sans-serif;
    font-size:1.6rem;
    font-weight:700;
    color:var(--postmark);
    line-height:1;
  }
  .postmark .of{
    font-family:'JetBrains Mono', monospace;
    font-size:.55rem;
    letter-spacing:.1em;
    color:var(--postmark);
    margin-top:2px;
  }

  /* ---- Text content ---- */
  .content{
    padding:70px 28px 40px;
  }
  .location{
    font-family:'Rubik', sans-serif;
    font-weight:500;
    font-size:.72rem;
    letter-spacing:.14em;
    color:var(--sage);
    text-transform:uppercase;
    margin-bottom:.6rem;
  }
  .title{
    font-family:'Rubik', sans-serif;
    font-weight:800;
    font-size:2.3rem;
    color:var(--postmark);
    line-height:1.15;
    margin-bottom:1.1rem;
  }
  .story{
    font-family:'Frank Ruhl Libre', serif;
    font-size:1.05rem;
    line-height:1.75;
    color:var(--ink);
  }
  .story p + p{
    margin-top:1rem;
  }

  .divider{
    width:44px;
    height:2px;
    background:var(--sage);
    opacity:.4;
    margin:1.8rem 0;
  }

  .meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'JetBrains Mono', monospace;
    font-size:.7rem;
    color:var(--kraft);
    letter-spacing:.05em;
  }

  .download-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top:2rem;
    padding:.95rem 1.2rem;
    background:var(--ink);
    color:var(--paper);
    text-decoration:none;
    border-radius:2px;
    font-family:'Heebo', sans-serif;
    font-size:.95rem;
    font-weight:500;
    transition:background .15s ease, transform .1s ease;
  }
  .download-btn:active{
    transform:scale(.98);
  }
  .download-btn:hover{
    background:var(--postmark);
  }
  .download-btn .size-tag{
    font-family:'JetBrains Mono', monospace;
    font-size:.68rem;
    opacity:.65;
    letter-spacing:.05em;
    white-space:nowrap;
  }

  footer{
    text-align:center;
    padding:1.4rem 0 2rem;
    font-family:'JetBrains Mono', monospace;
    font-size:.65rem;
    color:var(--kraft);
    opacity:.6;
    letter-spacing:.08em;
  }
</style>
</head>
